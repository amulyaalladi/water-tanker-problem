<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Water Tank Problem</title>
<style>
  :root {
    --bg: #f5f7fa;
    --surface: #ffffff;
    --text: #14213d;
    --muted: #5b6678;
    --line: #c9d2de;
    --block: #ffd60a;
    --water: #00a6f4;
    --error: #b3261e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0e1726;
      --surface: #16223a;
      --text: #e8eef8;
      --muted: #9aa8bf;
      --line: #2c3c5a;
      --error: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 24px 16px 48px;
    background: var(--bg);
    color: var(--text);
    font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 1.9rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  p.lead { margin: 0 0 20px; color: var(--muted); }
  form { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 8px; }
  input[type="text"] {
    flex: 1 1 260px;
    padding: 10px 12px;
    font: inherit;
    color: var(--text);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  button {
    padding: 10px 18px;
    font: inherit;
    font-weight: 600;
    color: #fff;
    background: var(--water);
    border: 0;
    border-radius: 6px;
    cursor: pointer;
  }
  button:focus-visible, input:focus-visible { outline: 3px solid var(--text); outline-offset: 2px; }
  #error { min-height: 1.5em; margin: 0 0 12px; color: var(--error); font-size: 0.95rem; }
  .result {
    display: flex; align-items: baseline; gap: 10px;
    margin: 8px 0 12px;
  }
  .result strong { font-size: 3rem; line-height: 1; color: var(--water); }
  .result span { color: var(--muted); }
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px;
    overflow-x: auto;
  }
  .panel h2 { margin: 0 0 8px; font-size: 1rem; }
  svg { display: block; max-width: 100%; height: auto; }
  .legend { display: flex; gap: 16px; margin-top: 10px; font-size: 0.9rem; color: var(--muted); }
  .legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; border: 1px solid var(--line); vertical-align: -1px; }
</style>
</head>
<body>
<main>
  <h1>Water tank</h1>
  <p class="lead">Enter block heights separated by commas to see how much water collects between them.</p>

  <form id="form" novalidate>
    <input type="text" id="input" value="0,4,0,0,0,6,0,6,4,0" aria-label="Block heights, comma separated" autocomplete="off">
    <button type="submit">Calculate</button>
  </form>
  <p id="error" role="alert"></p>

  <div class="result" aria-live="polite">
    <strong id="total">0</strong><span>units of water</span>
  </div>

  <section class="panel">
    <h2>Water stored between blocks</h2>
    <div id="chart"></div>
    <div class="legend">
      <span><i style="background: var(--block)"></i>Block</span>
      <span><i style="background: var(--water)"></i>Water</span>
    </div>
  </section>
</main>

<script>
  const SVG_NS = "http://www.w3.org/2000/svg";
  const CELL = 40;

  // Two-pointer scan: O(n) time, O(1) extra space for the total.
  function trappedWater(heights) {
    let left = 0, right = heights.length - 1;
    let leftMax = 0, rightMax = 0, total = 0;
    while (left < right) {
      if (heights[left] < heights[right]) {
        leftMax = Math.max(leftMax, heights[left]);
        total += leftMax - heights[left];
        left++;
      } else {
        rightMax = Math.max(rightMax, heights[right]);
        total += rightMax - heights[right];
        right--;
      }
    }
    return total;
  }

  // Water above each column = min(tallest to the left, tallest to the right) - height.
  function waterPerColumn(heights) {
    const n = heights.length;
    const leftMax = new Array(n), rightMax = new Array(n);
    let m = 0;
    for (let i = 0; i < n; i++) { m = Math.max(m, heights[i]); leftMax[i] = m; }
    m = 0;
    for (let i = n - 1; i >= 0; i--) { m = Math.max(m, heights[i]); rightMax[i] = m; }
    return heights.map((h, i) => Math.min(leftMax[i], rightMax[i]) - h);
  }

  function parseInput(text) {
    const parts = text.replace(/[\[\]]/g, "").split(",").map(s => s.trim());
    if (parts.length === 0 || parts.some(p => p === "")) {
      throw new Error("Enter at least one number, separated by commas (e.g. 0,4,0,6).");
    }
    return parts.map(p => {
      const num = Number(p);
      if (!Number.isInteger(num) || num < 0) {
        throw new Error(`"${p}" is not valid. Use whole numbers of 0 or more.`);
      }
      if (num > 50) {
        throw new Error("Keep each height at 50 or below so the chart stays readable.");
      }
      return num;
    });
  }

  function el(name, attrs) {
    const node = document.createElementNS(SVG_NS, name);
    for (const k in attrs) node.setAttribute(k, attrs[k]);
    return node;
  }

  function render(heights, water) {
    const rows = Math.max(1, Math.max(...heights.map((h, i) => h + water[i])));
    const w = heights.length * CELL, h = rows * CELL;
    const svg = el("svg", { viewBox: `0 0 ${w} ${h}`, width: w, height: h, role: "img",
      "aria-label": `Bar chart of ${heights.length} blocks holding ${water.reduce((a, b) => a + b, 0)} units of water` });

    const cell = (col, row, fill) => svg.appendChild(el("rect", {
      x: col * CELL, y: h - (row + 1) * CELL, width: CELL, height: CELL,
      fill, stroke: "#14213d", "stroke-opacity": 0.35, "stroke-width": 1
    }));

    // Empty grid
    for (let c = 0; c < heights.length; c++)
      for (let r = 0; r < rows; r++)
        svg.appendChild(el("rect", { x: c * CELL, y: r * CELL, width: CELL, height: CELL,
          fill: "none", stroke: "#8a97ab", "stroke-opacity": 0.35, "stroke-width": 1 }));

    heights.forEach((bh, c) => {
      for (let r = 0; r < bh; r++) cell(c, r, "#ffd60a");
      for (let r = bh; r < bh + water[c]; r++) cell(c, r, "#00a6f4");
    });

    const chart = document.getElementById("chart");
    chart.replaceChildren(svg);
  }

  function run() {
    const errorEl = document.getElementById("error");
    errorEl.textContent = "";
    try {
      const heights = parseInput(document.getElementById("input").value);
      const water = waterPerColumn(heights);
      document.getElementById("total").textContent = trappedWater(heights);
      render(heights, water);
    } catch (e) {
      errorEl.textContent = e.message;
    }
  }

  document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); run(); });
  run();
</script>
</body>
</html>
